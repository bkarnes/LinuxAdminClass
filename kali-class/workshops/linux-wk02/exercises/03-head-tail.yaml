id: "03"
title: "Peek at a big file, in pieces"
prompt: |
  Log files and config files are usually huge. Nobody cats a 2-million-line
  file into their terminal on purpose.

  First, make yourself a big test file inside your practice directory:

      seq 1 1000 > ~/practice/biglog.txt

  Then:

  1. Show only the FIRST 5 lines, saving them to
     ~/practice/head-out.txt
  2. Show only the LAST 5 lines, saving them to
     ~/practice/tail-out.txt
hints:
  - "head shows the start: head -n 5 ~/practice/biglog.txt > ~/practice/head-out.txt"
  - "tail shows the end: tail -n 5 ~/practice/biglog.txt > ~/practice/tail-out.txt"
  - "Keep both output files in ~/practice with the big file — everything for this lab lives in one place."
verify:
  script: "03-head-tail.verify.sh"
  timeout: 10
on_success: "head and tail — how you sample big logs without drowning."